<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t">
  <title id="t">A very blue planet, lit by a bright yellow star, with its single moon</title>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090d1a"/>
      <stop offset="1" stop-color="#121a30"/>
    </linearGradient>
    <radialGradient id="starlight" cx="0.02" cy="0.04" r="0.75">
      <stop offset="0" stop-color="#ffe7a3" stop-opacity="0.22"/>
      <stop offset="0.35" stop-color="#ffd46b" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffd46b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ocean" cx="0.34" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#a9dcf7"/>
      <stop offset="0.28" stop-color="#4b9ad6"/>
      <stop offset="0.6" stop-color="#1f62a4"/>
      <stop offset="1" stop-color="#0c2a55"/>
    </radialGradient>
    <radialGradient id="night" cx="0.3" cy="0.26" r="0.95">
      <stop offset="0.3" stop-color="#040814" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#040814" stop-opacity="0.55"/>
      <stop offset="0.84" stop-color="#040814" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#040814" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.47" cy="0.47" r="0.5">
      <stop offset="0.86" stop-color="#7cc4f4" stop-opacity="0.24"/>
      <stop offset="0.92" stop-color="#7cc4f4" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7cc4f4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonFill" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ecebe6"/>
      <stop offset="0.55" stop-color="#a7a59f"/>
      <stop offset="1" stop-color="#3b3a39"/>
    </radialGradient>
    <clipPath id="planetClip"><circle cx="800" cy="500" r="310"/></clipPath>
    <clipPath id="moonClip"><circle cx="300" cy="235" r="44"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#space)"/>
  <rect width="1200" height="800" fill="url(#starlight)"/>

  <g fill="#ffffff">
    <circle cx="62" cy="410" r="1.2" opacity="0.7"/>
    <circle cx="118" cy="96" r="1.6" opacity="0.85"/>
    <circle cx="164" cy="612" r="1" opacity="0.5"/>
    <circle cx="205" cy="338" r="1.4" opacity="0.75"/>
    <circle cx="246" cy="742" r="1.2" opacity="0.6"/>
    <circle cx="282" cy="482" r="0.9" opacity="0.5"/>
    <circle cx="341" cy="58" r="1.1" opacity="0.65"/>
    <circle cx="372" cy="366" r="1.7" opacity="0.9"/>
    <circle cx="418" cy="664" r="1" opacity="0.55"/>
    <circle cx="452" cy="148" r="1.3" opacity="0.7"/>
    <circle cx="489" cy="520" r="0.9" opacity="0.45"/>
    <circle cx="512" cy="286" r="1.2" opacity="0.65"/>
    <circle cx="548" cy="44" r="1.5" opacity="0.8"/>
    <circle cx="586" cy="766" r="1.1" opacity="0.6"/>
    <circle cx="612" cy="118" r="0.9" opacity="0.5"/>
    <circle cx="664" cy="196" r="1.3" opacity="0.7"/>
    <circle cx="708" cy="72" r="1" opacity="0.55"/>
    <circle cx="776" cy="152" r="1.6" opacity="0.85"/>
    <circle cx="842" cy="40" r="1.1" opacity="0.6"/>
    <circle cx="905" cy="128" r="0.9" opacity="0.5"/>
    <circle cx="968" cy="88" r="1.4" opacity="0.75"/>
    <circle cx="1034" cy="166" r="1.1" opacity="0.6"/>
    <circle cx="1092" cy="56" r="1.7" opacity="0.9"/>
    <circle cx="1146" cy="214" r="1" opacity="0.55"/>
    <circle cx="1170" cy="372" r="1.3" opacity="0.7"/>
    <circle cx="1128" cy="618" r="0.9" opacity="0.5"/>
    <circle cx="1182" cy="760" r="1.2" opacity="0.6"/>
    <circle cx="88" cy="232" r="0.9" opacity="0.5"/>
    <circle cx="36" cy="676" r="1.4" opacity="0.7"/>
    <circle cx="322" cy="586" r="1.1" opacity="0.55"/>
    <circle cx="140" cy="512" r="0.8" opacity="0.45"/>
    <circle cx="430" cy="770" r="0.9" opacity="0.5"/>
  </g>

  <!-- The third planet -->
  <g transform="translate(850 545) scale(1.07) translate(-800 -500)">
  <circle cx="800" cy="500" r="356" fill="url(#halo)"/>
  <circle cx="800" cy="500" r="310" fill="url(#ocean)"/>
  <g clip-path="url(#planetClip)" fill="#ffffff">
    <g filter="url(#softer)" opacity="0.5">
      <ellipse cx="640" cy="330" rx="150" ry="34" transform="rotate(-18 640 330)"/>
      <ellipse cx="760" cy="420" rx="210" ry="26" transform="rotate(-12 760 420)"/>
      <ellipse cx="900" cy="250" rx="120" ry="22" transform="rotate(-8 900 250)"/>
      <ellipse cx="620" cy="560" rx="170" ry="30" transform="rotate(-20 620 560)"/>
    </g>
    <g filter="url(#soft)" opacity="0.62">
      <ellipse cx="600" cy="380" rx="90" ry="12" transform="rotate(-16 600 380)"/>
      <ellipse cx="720" cy="300" rx="70" ry="9" transform="rotate(-10 720 300)"/>
      <ellipse cx="560" cy="470" rx="60" ry="10" transform="rotate(-24 560 470)"/>
      <ellipse cx="830" cy="470" rx="120" ry="10" transform="rotate(-14 830 470)"/>
      <ellipse cx="700" cy="640" rx="110" ry="14" transform="rotate(-22 700 640)"/>
      <ellipse cx="980" cy="360" rx="80" ry="8" transform="rotate(-6 980 360)"/>
    </g>
  </g>
  <circle cx="800" cy="500" r="310" fill="url(#night)"/>
  <circle cx="800" cy="500" r="309" fill="none" stroke="#9fd8ff" stroke-width="3" opacity="0.28" filter="url(#soft)"/>

  </g>

  <!-- Its single moon -->
  <g transform="translate(250 -40)">
  <circle cx="300" cy="235" r="44" fill="url(#moonFill)"/>
  <g clip-path="url(#moonClip)" fill="#4d4b48" opacity="0.35">
    <ellipse cx="288" cy="222" rx="9" ry="7"/>
    <ellipse cx="314" cy="246" rx="6" ry="5"/>
    <ellipse cx="296" cy="258" rx="4" ry="3"/>
    <ellipse cx="318" cy="216" rx="3.5" ry="3"/>
  </g>
  <circle cx="300" cy="235" r="44" fill="url(#night)"/>
  </g>
</svg>
