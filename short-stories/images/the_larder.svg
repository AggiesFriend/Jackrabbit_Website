<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t">
  <title id="t">A sealed white pod on a low plinth in a dark hall, lit from above, with fruit visible through the glass panel in its lid</title>
  <defs>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090d1a"/>
      <stop offset="1" stop-color="#121a30"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a3" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffe7a3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="casing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f5ef"/>
      <stop offset="0.5" stop-color="#d9d6cc"/>
      <stop offset="1" stop-color="#9f9c93"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcd9d0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#bfe3ff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="plinth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3350"/>
      <stop offset="1" stop-color="#141b30"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe7a3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffe7a3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="frost" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.3"/>
    </radialGradient>
    <clipPath id="panelClip"><rect x="700" y="372" width="300" height="118" rx="14"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#hall)"/>

  <!-- distant benches -->
  <g opacity="0.5" filter="url(#softer)">
    <rect x="40" y="430" width="420" height="10" fill="#1b2440"/>
    <rect x="40" y="480" width="420" height="10" fill="#1b2440"/>
    <rect x="40" y="530" width="420" height="10" fill="#1b2440"/>
    <rect x="1120" y="440" width="80" height="10" fill="#1b2440"/>
    <rect x="1120" y="490" width="80" height="10" fill="#1b2440"/>
  </g>

  <!-- cone of light -->
  <polygon points="840,0 560,640 1120,640" fill="url(#beam)"/>
  <ellipse cx="850" cy="640" rx="330" ry="60" fill="url(#pool)"/>

  <!-- floor -->
  <rect x="0" y="640" width="1200" height="160" fill="#0a0e1c"/>
  <rect x="0" y="638" width="1200" height="4" fill="#1b2440"/>

  <!-- plinth -->
  <rect x="610" y="560" width="480" height="80" rx="4" fill="url(#plinth)"/>
  <rect x="610" y="560" width="480" height="6" fill="#3b4664"/>
  <rect x="610" y="640" width="480" height="40" fill="#0d1225" opacity="0.9"/>

  <!-- pod -->
  <g>
    <!-- shadow -->
    <ellipse cx="850" cy="562" rx="200" ry="14" fill="#000" opacity="0.5" filter="url(#soft)"/>
    <!-- body -->
    <rect x="660" y="430" width="380" height="130" rx="22" fill="url(#casing)"/>
    <rect x="660" y="430" width="380" height="130" rx="22" fill="url(#frost)"/>
    <!-- seam -->
    <rect x="660" y="428" width="380" height="5" fill="#8a877f"/>
    <line x1="660" y1="430.5" x2="1040" y2="430.5" stroke="#5f5c55" stroke-width="1"/>
    <!-- latch housings -->
    <rect x="690" y="422" width="22" height="18" rx="3" fill="#b9b6ad" stroke="#7a776f" stroke-width="1"/>
    <rect x="988" y="422" width="22" height="18" rx="3" fill="#b9b6ad" stroke="#7a776f" stroke-width="1"/>
    <!-- lid -->
    <path d="M 660 430 L 660 390 Q 660 340 710 340 L 990 340 Q 1040 340 1040 390 L 1040 430 Z" fill="url(#lid)"/>
    <path d="M 660 430 L 660 390 Q 660 340 710 340 L 990 340 Q 1040 340 1040 390 L 1040 430 Z" fill="url(#frost)"/>
    <!-- glass panel and what lies beneath it -->
    <rect x="700" y="372" width="300" height="118" rx="14" fill="#0f1a2e"/>
    <g clip-path="url(#panelClip)">
      <rect x="700" y="372" width="300" height="118" fill="#1a2438"/>
      <!-- fruit, cold and perfect -->
      <circle cx="742" cy="452" r="22" fill="#b3261e"/>
      <circle cx="736" cy="446" r="8" fill="#e05a4a" opacity="0.6" filter="url(#soft)"/>
      <circle cx="786" cy="462" r="20" fill="#5e8f2e"/>
      <circle cx="780" cy="456" r="7" fill="#9fc35b" opacity="0.6" filter="url(#soft)"/>
      <circle cx="834" cy="450" r="24" fill="#e2842a"/>
      <circle cx="827" cy="442" r="8" fill="#ffb867" opacity="0.6" filter="url(#soft)"/>
      <circle cx="880" cy="464" r="18" fill="#c9343a"/>
      <circle cx="876" cy="458" r="6" fill="#ff7a70" opacity="0.6" filter="url(#soft)"/>
      <g fill="#6a3b8c">
        <circle cx="918" cy="444" r="7"/><circle cx="930" cy="452" r="7"/><circle cx="922" cy="460" r="7"/><circle cx="936" cy="466" r="7"/><circle cx="912" cy="458" r="7"/>
      </g>
      <g fill="#e6c24a">
        <rect x="954" y="420" width="4" height="60" rx="2" transform="rotate(8 956 450)"/>
        <rect x="964" y="416" width="4" height="64" rx="2" transform="rotate(-4 966 448)"/>
        <rect x="974" y="424" width="4" height="56" rx="2" transform="rotate(12 976 452)"/>
      </g>
      <ellipse cx="968" cy="474" rx="24" ry="9" fill="#8a2d2d"/>
      <ellipse cx="968" cy="472" rx="22" ry="7" fill="#a63a3a"/>
      <!-- mist on the inside of the glass -->
      <rect x="700" y="372" width="300" height="118" fill="#bfe3ff" opacity="0.08"/>
      <ellipse cx="760" cy="392" rx="90" ry="22" fill="#ffffff" opacity="0.12" filter="url(#softer)"/>
    </g>
    <rect x="700" y="372" width="300" height="118" rx="14" fill="url(#glass)"/>
    <rect x="700" y="372" width="300" height="118" rx="14" fill="none" stroke="#8a877f" stroke-width="3"/>
    <rect x="700" y="372" width="300" height="118" rx="14" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <!-- highlight along the lid -->
    <path d="M 700 352 Q 850 342 1000 352" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6" filter="url(#soft)"/>
    <!-- control on the housing -->
    <circle cx="1012" cy="520" r="7" fill="#2a3350" stroke="#8a877f" stroke-width="1.5"/>
    <circle cx="1012" cy="520" r="2.5" fill="#8cc8ee"/>
  </g>

  <!-- the camera, on its bracket -->
  <g>
    <rect x="1128" y="60" width="8" height="150" fill="#1b2440"/>
    <rect x="1086" y="196" width="50" height="8" fill="#1b2440"/>
    <g transform="translate(1078 204) rotate(28)">
      <rect x="-26" y="-12" width="52" height="24" rx="4" fill="#232c46" stroke="#3b4664" stroke-width="1.5"/>
      <circle cx="-26" cy="0" r="9" fill="#0a0e1c" stroke="#3b4664" stroke-width="1.5"/>
      <circle cx="-26" cy="0" r="3" fill="#2b6699"/>
      <circle cx="18" cy="-6" r="2" fill="#e05a4a"/>
    </g>
  </g>
</svg>
