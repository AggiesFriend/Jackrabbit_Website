<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="Tier Four, a free browser game set alongside Book 4 of The Jackrabbit Series, Coming of Age. In development.">
    <meta name="author" content="Tony Marks">
    <title>Tier Four - The Jackrabbit Series</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* Placeholder only. Colours and fonts follow css/styles.css. */
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --light-text: #f9f9f9;
            --muted-text: #c5d3e0;
            --panel: #1f2d3a;
            --edge: #3d5469;
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Merriweather', serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding:
                max(1rem, env(safe-area-inset-top))
                max(1rem, env(safe-area-inset-right))
                max(1rem, env(safe-area-inset-bottom))
                max(1rem, env(safe-area-inset-left));
            background-color: var(--primary-color);
            color: var(--light-text);
            font-family: var(--font-body);
            font-size: 1rem;
            line-height: 1.6;
        }

        main {
            width: 100%;
            max-width: 34rem;
            padding: 1.5rem 1.25rem;
            background-color: var(--panel);
            border: 1px solid var(--edge);
            border-radius: 8px;
        }

        .label {
            margin: 0 0 0.5rem;
            font-family: var(--font-heading);
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted-text);
        }

        h1 {
            margin: 0 0 1rem;
            font-family: var(--font-heading);
            font-size: clamp(2rem, 9vw, 2.75rem);
            font-weight: 700;
            line-height: 1.15;
        }

        p {
            margin: 0 0 1rem;
        }

        .status {
            color: var(--muted-text);
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        nav a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0.5rem 1.25rem;
            border: 1px solid var(--accent-color);
            border-radius: 6px;
            color: var(--light-text);
            font-family: var(--font-heading);
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
        }

        nav a:hover,
        nav a:focus-visible {
            background-color: var(--accent-color);
            color: #fff;
        }

        nav a:focus-visible {
            outline: 3px solid var(--light-text);
            outline-offset: 2px;
        }

        @media (min-width: 480px) {
            main {
                padding: 2.5rem 2.25rem;
            }
        }
    </style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="49bd03b2-61a5-4ce1-b653-a2d3f4f22441"></script>
</head>
<body>
    <main>
        <p class="label">The Jackrabbit Series</p>
        <h1>Tier Four</h1>
        <p>A free browser game set alongside Book 4, <em>Coming of Age</em>.</p>
        <p class="status">In development. Check back soon.</p>
        <nav aria-label="Further reading">
            <a href="../games.html">All games</a>
            <a href="../book4.html">About Book 4</a>
        </nav>
    </main>
</body>
</html>
